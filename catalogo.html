<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Astro Tickets · Catálogo de eventos</title>
<link rel="icon" type="image/png" href="multimedia/favicon.svg" />
<link rel="stylesheet" href="css/styles.css" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
</head>
<body>
<div class="atmosphere"><span class="glow-a"></span><span class="glow-b"></span></div>

<header class="navbar">
  <div class="container">
    <a class="brand" href="catalogo.html">
      <img src="multimedia/logo.svg" alt="Astro Tickets" class="brand-logo" />
    </a>
    <button class="btn-ghost btn lang-btn" id="lang-btn" aria-label="Idioma" style="margin-left: auto; margin-right: 8px; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
      <span class="material-symbols-outlined" style="font-size: 1.3rem;">translate</span>
    </button>
    <nav class="nav-links">
      <a class="active" href="catalogo.html" data-i18n="nav.eventos">Eventos</a>
      <a href="historial.html" data-i18n="nav.boletos">Mis compras</a>
      <a href="index.html" data-i18n="nav.login">Iniciar sesión</a>
    </nav>
  </div>
</header>

<main class="container section">
  <div class="section-head">
    <div>
      <p class="eyebrow" data-i18n="catalog.eyebrow">Listado de eventos disponibles</p>
      <h1 style="font-size: 2.2rem;" data-i18n="catalog.title">Encuentra tu próximo evento</h1>
      <p class="text-muted" style="margin-top: 6px;" data-i18n="catalog.subtitle">Explora conciertos, teatro, deportes y más.</p>
    </div>
  </div>

  <!-- Búsqueda de eventos -->
  <div class="glass-panel search-panel">
    <div class="input-wrap" style="flex: 2; min-width: 220px;">
      <span class="material-symbols-outlined">search</span>
      <input class="input" type="text" id="event-search" placeholder="Buscar por nombre o lugar..." data-i18n="catalog.search" />
    </div>
    <select class="input" id="event-category" style="flex: 1; min-width: 180px;">
      <option value="todas" data-i18n="catalog.all">Todas las categorías</option>
      <option value="concierto" data-i18n="catalog.concerts">Conciertos</option>
      <option value="teatro" data-i18n="catalog.theater">Teatro</option>
      <option value="deportes" data-i18n="catalog.sports">Deportes</option>
      <option value="conferencia" data-i18n="catalog.conferences">Conferencias</option>
    </select>
  </div>

  <div class="events-grid" id="catalog-events">
  </div>
</main>



<footer class="site-footer">
  <div class="container">
    <img src="multimedia/logo.svg" alt="Astro Tickets" class="footer-logo" />
    <p class="bottom" data-i18n="footer">© 2026 Astro Tickets. Proyecto académico — Ingeniería de Software II, UNPHU.</p>
  </div>
</footer>

<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
