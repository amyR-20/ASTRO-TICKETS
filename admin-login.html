<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Astro Tickets · Acceso administrador</title>
<link rel="icon" type="image/png" href="multimedia/favicon.svg" />
<link rel="stylesheet" href="css/styles.css" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
</head>
<body>
<div class="atmosphere"><span class="glow-a"></span><span class="glow-b"></span></div>

<header class="navbar">
  <div class="container">
    <a class="brand" href="catalogo.html">
      <img src="multimedia/logo.svg" alt="Astro Tickets" class="brand-logo" />
    </a>
    <button class="btn-ghost btn lang-btn" id="lang-btn" aria-label="Idioma" style="margin-left: auto; margin-right: 8px; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
      <span class="material-symbols-outlined" style="font-size: 1.3rem;">translate</span>
    </button>
    <nav class="nav-links">
      <a href="index.html" data-i18n="nav.usuario">Usuario</a>
      <a class="active" href="admin-login.html" data-i18n="nav.admin">Administrador</a>
    </nav>
  </div>
</header>

<main class="center-page">
  <div class="glass-panel auth-card admin-access-card">
    <div style="text-align: center; margin-bottom: 32px;">
      <div style="width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, var(--cosmic-purple), var(--cosmic-purple-deep)); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px;">
        <span class="material-symbols-outlined" style="font-size: 2rem; color: #fff;">admin_panel_settings</span>
      </div>
      <h1 style="font-size: 1.7rem; margin-top: 4px;" data-i18n="admin.login.title">Panel de administración</h1>
      <p class="text-muted" style="margin-top: 8px; font-size: 0.9rem;">Selecciona tu perfil y escribe tu contraseña personal.</p>
    </div>

    <div class="admin-profile-picker" role="list" aria-label="Perfiles administrativos">
      <button type="button" class="admin-profile-option" data-admin-email="amy@gmail.com" data-admin-name="Amy"><span class="admin-profile-avatar amy">A</span><span><strong>Amy</strong><small>Administradora general</small></span><span class="material-symbols-outlined">arrow_forward</span></button>
      <button type="button" class="admin-profile-option" data-admin-email="admin@astro.com" data-admin-name="Víctor"><span class="admin-profile-avatar victor">V</span><span><strong>Víctor</strong><small>Administrador de operaciones</small></span><span class="material-symbols-outlined">arrow_forward</span></button>
      <button type="button" class="admin-profile-option" data-admin-email="sarahtapiamercedes22@gmail.com" data-admin-name="Sarah"><span class="admin-profile-avatar sarah">S</span><span><strong>Sarah</strong><small>Administradora de eventos</small></span><span class="material-symbols-outlined">arrow_forward</span></button>
    </div>
    <div class="admin-selected-profile" id="admin-selected-profile"><span class="material-symbols-outlined">touch_app</span> Selecciona uno de los tres perfiles</div>

    <form id="admin-login-form">
      <div class="field">
        <label for="admin-email" data-i18n="admin.login.email">Correo electrónico</label>
        <div class="input-wrap">
          <span class="material-symbols-outlined">mail</span>
          <input class="input" type="email" id="admin-email" name="admin-email" placeholder="Selecciona un perfil arriba" readonly required />
        </div>
      </div>

      <div class="field">
        <label for="admin-password" data-i18n="admin.login.password">Contraseña</label>
        <div class="input-wrap">
          <span class="material-symbols-outlined">lock</span>
          <input class="input" type="password" id="admin-password" name="admin-password" placeholder="••••••••" required />
          <button type="button" class="toggle-visibility" aria-label="Mostrar contraseña">
            <span class="material-symbols-outlined">visibility</span>
          </button>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 28px;">
        <input type="checkbox" id="admin-remember" style="width: 16px; height: 16px; accent-color: var(--cosmic-purple); cursor: pointer;" />
        <label for="admin-remember" style="font-size: 0.85rem; color: var(--color-on-surface-variant); cursor: pointer;" data-i18n="admin.login.remember">Recordar sesión</label>
      </div>

      <div id="admin-login-error" style="display: none; padding: 12px 16px; border-radius: var(--radius-md); background: var(--color-error-container); color: var(--color-on-error-container); font-size: 0.85rem; margin-bottom: 20px;">
        <span class="material-symbols-outlined" style="font-size: 1.1rem; vertical-align: middle; margin-right: 6px;">error</span>
        <span data-i18n="admin.login.error">Credenciales incorrectas. Intenta de nuevo.</span>
      </div>

      <button type="submit" class="btn btn-primary btn-block auth-submit">
        <span data-i18n="admin.login.btn">Acceder al panel</span>
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </form>

    <p class="auth-footer-link">
      <a href="index.html" style="font-size: 0.85rem;">
        <span class="material-symbols-outlined" style="font-size: 0.95rem; vertical-align: middle;">arrow_back</span>
        <span data-i18n="admin.login.back">Volver al inicio de sesión de usuario</span>
      </a>
    </p>
  </div>
</main>


<script src="js/i18n.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>

<script src="js/main.js"></script>
<script>
document.querySelectorAll('.admin-profile-option').forEach((option) => {
  option.addEventListener('click', () => {
    document.querySelectorAll('.admin-profile-option').forEach((item) => item.classList.remove('selected'));
    option.classList.add('selected');
    document.getElementById('admin-email').value = option.dataset.adminEmail;
    document.getElementById('admin-selected-profile').innerHTML = '<span class="material-symbols-outlined">verified_user</span> Entrarás como <strong>' + option.dataset.adminName + '</strong>';
    document.getElementById('admin-password').focus();
  });
});
const requestedProfile = new URLSearchParams(location.search).get('profile');
if (requestedProfile) document.querySelector(`.admin-profile-option[data-admin-email="${CSS.escape(requestedProfile)}"]`)?.click();
</script>
</body>
</html>
