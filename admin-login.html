<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Astro Tickets · Acceso administrador</title>
<link rel="stylesheet" href="css/styles.css" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
</head>
<body>
<div class="atmosphere"><span class="glow-a"></span><span class="glow-b"></span></div>

<header class="navbar">
  <div class="container">
    <a class="brand" href="index.html">
      <span class="material-symbols-outlined">confirmation_number</span>
      Astro Tickets
    </a>
    <button class="nav-toggle btn-ghost btn" aria-label="Abrir menú">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <nav class="nav-links">
      <a href="index.html">Usuario</a>
      <a class="active" href="admin-login.html">Administrador</a>
    </nav>
  </div>
</header>

<main class="center-page">
  <div class="glass-panel auth-card" style="max-width: 440px; padding: 48px 40px;">
    <div style="text-align: center; margin-bottom: 32px;">
      <div style="width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, var(--cosmic-purple), var(--cosmic-purple-deep)); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px;">
        <span class="material-symbols-outlined" style="font-size: 2rem; color: #fff;">admin_panel_settings</span>
      </div>
      <h1 style="font-size: 1.7rem; margin-top: 4px;">Panel de administración</h1>
      <p class="text-muted" style="margin-top: 8px; font-size: 0.9rem;">Accede con tus credenciales de administrador.</p>
    </div>

    <form id="admin-login-form">
      <div class="field">
        <label for="admin-email">Correo electrónico</label>
        <div class="input-wrap">
          <span class="material-symbols-outlined">mail</span>
          <input class="input" type="email" id="admin-email" name="admin-email" placeholder="admin@astro tickets.com" required />
        </div>
      </div>

      <div class="field">
        <label for="admin-password">Contraseña</label>
        <div class="input-wrap">
          <span class="material-symbols-outlined">lock</span>
          <input class="input" type="password" id="admin-password" name="admin-password" placeholder="••••••••" required />
          <button type="button" class="toggle-visibility" aria-label="Mostrar contraseña">
            <span class="material-symbols-outlined">visibility</span>
          </button>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 28px;">
        <input type="checkbox" id="admin-remember" style="width: 16px; height: 16px; accent-color: var(--cosmic-purple); cursor: pointer;" />
        <label for="admin-remember" style="font-size: 0.85rem; color: var(--color-on-surface-variant); cursor: pointer;">Recordar sesión</label>
      </div>

      <div id="admin-login-error" style="display: none; padding: 12px 16px; border-radius: var(--radius-md); background: var(--color-error-container); color: var(--color-on-error-container); font-size: 0.85rem; margin-bottom: 20px;">
        <span class="material-symbols-outlined" style="font-size: 1.1rem; vertical-align: middle; margin-right: 6px;">error</span>
        Credenciales incorrectas. Intenta de nuevo.
      </div>

      <button type="submit" class="btn btn-primary btn-block auth-submit">
        Acceder al panel
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </form>

    <p class="auth-footer-link">
      <a href="index.html" style="font-size: 0.85rem;">
        <span class="material-symbols-outlined" style="font-size: 0.95rem; vertical-align: middle;">arrow_back</span>
        Volver al inicio de sesión de usuario
      </a>
    </p>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/main.js"></script>
</body>
</html>
